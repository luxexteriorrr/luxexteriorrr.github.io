<!DOCTYPE html>
<!-- Recording the phone screens on the Mac (13 Oct). Sentra sits in a frame
     the size of the iPhone 17 Pro's screen below the status bar (402 × 812),
     drawn at 150% so a Retina screen recording comes out at the phone's own
     1206 × 2436. The frame keeps clear of the window's rounded corners; crop
     the recording to the frame. Opened by Sentra/captures/rec-window.mjs. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sentra</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  iframe { position: absolute; left: 16px; top: 16px; width: 402px; height: 812px; border: 0; display: block; zoom: 1.5; }
</style>
</head>
<body>
<iframe src="/?record" title="Sentra"></iframe>
</body>
</html>
